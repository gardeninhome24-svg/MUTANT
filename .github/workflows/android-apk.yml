name: MutantSurvivor Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_to_itch:
        description: "Publish built APK to private itch.io project (requires BUTLER_API_KEY)"
        type: boolean
        required: false
        default: false

# Continuous pushes should not launch dozens of parallel 1+ GB SDK downloads.
# Keep a separate slot for intentional manual builds and cancel stale push runs.
concurrency:
  group: mutant-android-apk-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK (Godot 4.7.2)
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROID_HOME: /usr/lib/android-sdk
      ANDROID_SDK_ROOT: /usr/lib/android-sdk

    steps:
      - name: Checkout game files
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Godot templates and Android SDK
        shell: bash
        run: |
          set -euo pipefail
          # Container setup is under /root, but GitHub Actions changes HOME to /github/home.
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cp -a /root/.local/share/godot/export_templates/4.7.2.stable/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          mkdir -p "$HOME/.config/godot"
          cp -a /root/.config/godot/. "$HOME/.config/godot/"
          # Godot's editor settings in the image contain Java, SDK and debug keystore paths.
          java -version
          test -f "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"
          test -f /root/debug.keystore
          # Android SDK mirrors occasionally return truncated/corrupt ZIPs.
          # Install each component separately, remove broken partial downloads
          # and retry. sdkmanager alone can report a warning without tools
          # actually being present, so validate executable files afterwards.
          yes | sdkmanager --licenses >/dev/null || true
          install_android_component() {
            local package="$1"
            local expected="$2"
            local partial="$3"
            for attempt in 1 2 3 4; do
              echo "Installing $package (attempt $attempt/4)"
              if sdkmanager --sdk_root="$ANDROID_HOME" "$package" && test -e "$expected"; then
                echo "$package installed and verified"
                return 0
              fi
              echo "::warning::Android SDK package $package failed or was incomplete (attempt $attempt)"
              rm -rf "$ANDROID_HOME/.temp" "$partial"
              sleep $((attempt * 5))
            done
            echo "::error::Unable to install valid Android SDK package $package after four attempts"
            return 1
          }
          install_android_component "platforms;android-35" "$ANDROID_HOME/platforms/android-35/android.jar" "$ANDROID_HOME/platforms/android-35"
          install_android_component "build-tools;35.0.0" "$ANDROID_HOME/build-tools/35.0.0/apksigner" "$ANDROID_HOME/build-tools/35.0.0"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
          godot --version

      - name: Import project resources and fail on GDScript compilation errors
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --import --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|Compilation failed|Failed to compile' /tmp/godot-import.log; then
            echo "::error::Godot resource import reported script compilation errors"
            exit 1
          fi

      - name: Install Python for private APK release report
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3
          python3 --version

      - name: Verify boss pack import tooling and unbundled asset safeguards
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/boss_art_pack.py tools/boss_art_geometry.py tools/google_play_preflight.py tools/beta_apk_preflight.py
          python3 tools/boss_art_geometry.py --self-test
          python3 tools/boss_art_pack.py --self-test
          # The optional 66 PNGs are supplied separately; CI must not confuse
          # fallback rendering with validation of the unbundled generated art.

      - name: Export Android debug APK
        run: |
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" build/android/MutantSurvivor.apk
          test -s build/android/MutantSurvivor.apk
          ls -lh build/android/MutantSurvivor.apk

      - name: Verify exported beta APK archive, signing and application ID
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/beta_apk_preflight.py --self-test
          python3 tools/beta_apk_preflight.py build/android/MutantSurvivor.apk | tee /tmp/beta-apk-preflight.log
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs build/android/MutantSurvivor.apk | tee /tmp/apk-signature.log
          grep -q "Signer #1 certificate SHA-256 digest:" /tmp/apk-signature.log
          "$AAPT" dump badging build/android/MutantSurvivor.apk > /tmp/apk-badging.log
          grep -E "^package: name='com\\.zielonadolina\\.mutantsurvivor' " /tmp/apk-badging.log
          sha256sum build/android/MutantSurvivor.apk > build/android/MutantSurvivor.apk.sha256
          cat build/android/MutantSurvivor.apk.sha256
          {
            echo ""
            echo "### Beta APK artifact validation"
            echo '~~~text'
            cat /tmp/beta-apk-preflight.log
            cat /tmp/apk-signature.log
            cat build/android/MutantSurvivor.apk.sha256
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Store installable debug APK early (not QA-approved)
        uses: actions/upload-artifact@v4
        with:
          name: MutantSurvivor-Android-APK-UNVERIFIED-${{ github.run_number }}
          path: |
            build/android/MutantSurvivor.apk
            build/android/MutantSurvivor.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Explain APK status to testers
        shell: bash
        run: |
          {
            echo "### Installable diagnostic APK is available"
            echo "The UNVERIFIED APK artifact was exported and its package/signature verified."
            echo "Gameplay QA continues after upload. A failed workflow means this APK"
            echo "is **NOT beta approved**; use only for internal debugging."
            echo "Only a green full job AND real handset testing may approve the private beta."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pre-beta structural validation (campaign and scenes)
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://qa/prebeta_validation.gd 2>&1 | tee /tmp/prebeta-validation.log
          grep -Fq 'PREBETA PASS:' /tmp/prebeta-validation.log

      - name: Full 100-stage F2P progression and rewards audit
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://qa/campaign_100_f2p.gd 2>&1 | tee /tmp/campaign-100-f2p.log
          if grep -E "(SCRIPT ERROR:|Parse Error:|Invalid call\\.|Invalid set index|Failed to load script|Failed loading resource|F2P FAIL:|F2P FAILED:)" /tmp/campaign-100-f2p.log; then
            echo "::error::100-stage F2P progression regression failed."
            exit 1
          fi
          grep -Fq 'F2P PASS:' /tmp/campaign-100-f2p.log

      - name: Verify production art paths and list remaining static sprites
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://qa/production_art_audit.gd 2>&1 | tee /tmp/production-art-audit.log
          if grep -E "(SCRIPT ERROR:|Parse Error:|ART FAIL:|ART RESOURCES FAILED:)" /tmp/production-art-audit.log; then
            echo "::error::Missing art resources or art-audit script regression."
            exit 1
          fi
          grep -Fq 'ART RESOURCES PASS:' /tmp/production-art-audit.log

      - name: Verify all boss and operator animation textures in the Godot runtime
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://qa/animated_art_runtime.gd 2>&1 | tee /tmp/animated-art-runtime.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Invalid call\\.|ANIMATED ART FAIL:|ANIMATED ART FAILED:" /tmp/animated-art-runtime.log; then
            echo "::error::The animation PNGs are not connected to the live Godot asset registry"
            exit 1
          fi
          grep -Fq 'ANIMATED ART PASS:' /tmp/animated-art-runtime.log

      - name: Portrait HUD overlap and required art resource gate
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://qa/visual_release_gate.gd 2>&1 | tee /tmp/visual-release-gate.log
          if grep -E "(SCRIPT ERROR:|Parse Error:|Invalid call\\.|Invalid set index|Failed to load script|Failed loading resource|VISUAL GATE FAIL:|VISUAL GATE FAILED:)" /tmp/visual-release-gate.log; then
            echo "::error::Visual resource or HUD geometry regression detected."
            exit 1
          fi
          grep -Fq 'VISUAL GATE PASS:' /tmp/visual-release-gate.log

      - name: Mobile menu, campaign and inventory layout regression
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://qa/mobile_ui_regression.gd 2>&1 | tee /tmp/mobile-ui-regression.log
          if grep -E "(SCRIPT ERROR:|Parse Error:|Invalid call\\.|Invalid set index|Failed to load script|Failed loading resource|MOBILE UI FAIL:|MOBILE UI FAILED:)" /tmp/mobile-ui-regression.log; then
            echo "::error::Mobile UI layout regression failed."
            exit 1
          fi
          grep -Fq 'MOBILE UI PASS:' /tmp/mobile-ui-regression.log

      - name: Premium beta bonus, shop and F2P reward regression
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://qa/premium_shop_regression.gd 2>&1 | tee /tmp/premium-shop-regression.log
          if grep -E "(SCRIPT ERROR:|Parse Error:|Invalid call\\.|Invalid set index|Failed to load script|Failed loading resource|PREMIUM QA FAIL:|PREMIUM QA FAILED:)" /tmp/premium-shop-regression.log; then
            echo "::error::Premium economy or beta-wallet regression failed."
            exit 1
          fi
          grep -Fq 'PREMIUM QA PASS:' /tmp/premium-shop-regression.log

      - name: Gameplay regression (bosses, rewards, equipment, saves)
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://qa/gameplay_regression.gd 2>&1 | tee /tmp/gameplay-regression.log
          if grep -E "(SCRIPT ERROR:|Parse Error:|Invalid call\\.|Invalid set index|Failed to load script|Failed loading resource|GAMEPLAY REGRESSION FAIL)" /tmp/gameplay-regression.log; then
            echo "::error::Gameplay regression logged an error."
            exit 1
          fi
          grep -Fq 'GAMEPLAY REGRESSION PASS:' /tmp/gameplay-regression.log

      - name: Report Google Play release blockers (informational for private APK only)
        shell: bash
        run: |
          set -euo pipefail
          command -v python3 >/dev/null
          python3 tools/google_play_preflight.py --report-only 2>&1 | tee /tmp/google-play-preflight.log
          {
            echo ""
            echo "### Google Play production readiness — informational only"
            echo ""
            echo '~~~text'
            cat /tmp/google-play-preflight.log
            echo '~~~'
            echo "A green debug APK is not a release approval; production AAB uses strict preflight."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Instantiate and validate every campaign combat scene (100/100)
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://qa/mission_scene_100_smoke.gd 2>&1 | tee /tmp/mission-scene-100.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Invalid call\\.|Failed to load script|MISSION SCENE FAIL:|MISSION SCENE FAILED:" /tmp/mission-scene-100.log; then
            echo "::error::One or more live campaign stages failed to instantiate"
            exit 1
          fi
          grep -Fq 'MISSION SCENE PASS: 100 real stage scenes instantiated' /tmp/mission-scene-100.log

      - name: Full gameplay loop — boss, victory, loot, save and next-stage defeat
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://qa/full_run_persistence.gd 2>&1 | tee /tmp/full-run-persistence.log
          if grep -E "(SCRIPT ERROR:|Parse Error:|Invalid call\\.|Invalid set index|Failed to load script|Failed loading resource|FULL RUN FAIL:|FULL RUN FAILED:)" /tmp/full-run-persistence.log; then
            echo "::error::Real end-to-end gameplay progression failed"
            exit 1
          fi
          grep -q 'FULL RUN PASS:' /tmp/full-run-persistence.log

      - name: All chapter boss finale integrations (10/10)
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://qa/chapter_boss_integration.gd 2>&1 | tee /tmp/chapter-boss-integration.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Invalid call\\.|Failed to load script|CHAPTER BOSS FAIL:|CHAPTER BOSS FAILED:" /tmp/chapter-boss-integration.log; then
            echo "::error::Chapter finale integration failed"
            exit 1
          fi
          grep -q 'CHAPTER BOSS PASS:' /tmp/chapter-boss-integration.log

      - name: Smoke test booting the main menu (headless)
        shell: bash
        run: |
          set -euo pipefail
          # Export succeeds even if runtime scripts throw errors during menu setup.
          # Boot the actual project for 30 frames and reject common runtime/parse failures.
          godot --headless --path . --quit-after 30 2>&1 | tee /tmp/mutantsurvivor-startup.log
          if grep -E "(SCRIPT ERROR:|Parse Error:|Invalid call\.|Invalid set index|Failed to load script|Failed loading resource)" /tmp/mutantsurvivor-startup.log; then
            echo "::error::Godot startup reported a script or resource error."
            exit 1
          fi

      - name: Smoke test first combat stage (headless)
        shell: bash
        run: |
          set -euo pipefail
          # Start actual gameplay, not only the main menu.
          godot --headless --path . --quit-after 120 res://scenes/main/main.tscn 2>&1 | tee /tmp/mutantsurvivor-combat.log
          if grep -E "(SCRIPT ERROR:|Parse Error:|Invalid call\\.|Invalid set index|Failed to load script|Failed loading resource)" /tmp/mutantsurvivor-combat.log; then
            echo "::error::Combat scene reported a script or resource error."
            exit 1
          fi

      - name: Preserve headless QA logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MutantSurvivor-QA-failure-logs
          path: |
            /tmp/beta-apk-preflight.log
            /tmp/apk-signature.log
            /tmp/apk-badging.log
            /tmp/google-play-preflight.log
            /tmp/prebeta-validation.log
            /tmp/production-art-audit.log
            /tmp/animated-art-runtime.log
            /tmp/campaign-100-f2p.log
            /tmp/gameplay-regression.log
            /tmp/mission-scene-100.log
            /tmp/chapter-boss-integration.log
            /tmp/full-run-persistence.log
            /tmp/premium-shop-regression.log
            /tmp/visual-release-gate.log
            /tmp/mobile-ui-regression.log
            /tmp/mutantsurvivor-startup.log
            /tmp/mutantsurvivor-combat.log
          if-no-files-found: warn
          retention-days: 14

      - name: Publish QA results in workflow summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## MUTANT — beta QA at commit $GITHUB_SHA"
            echo ""
            echo "| Test | Verified result in log |"
            echo "|---|---|"
            for entry in \
              "100-stage campaign:/tmp/campaign-100-f2p.log:F2P PASS:" \
              "100 real stage scenes:/tmp/mission-scene-100.log:MISSION SCENE PASS:" \
              "Boss finale integration:/tmp/chapter-boss-integration.log:CHAPTER BOSS PASS:" \
              "Full-run save and rewards:/tmp/full-run-persistence.log:FULL RUN PASS:" \
              "Visual geometry:/tmp/visual-release-gate.log:VISUAL GATE PASS:" \
              "APK structure:/tmp/beta-apk-preflight.log:STRUCTURE PASS"; do
              name="${entry%%:*}"
              rest="${entry#*:}"
              log="${rest%%:*}"
              marker="${rest#*:}"
              if [ ! -s "$log" ]; then
                echo "| $name | NOT EXECUTED / NO LOG |"
              elif grep -Fq "$marker" "$log"; then
                echo "| $name | PASS marker found (see corresponding step) |"
              else
                echo "| $name | NO PASS MARKER — review step |"
              fi
            done
            echo ""
            echo "A PASS marker is only a supporting log signal; the GitHub job conclusion is authoritative."
            echo "APK ZIP, signature and package checks are reflected in the Android job result."
            echo "Physical-device QA and screenshot review remain mandatory."
            echo ""
            echo "### Errors"
            echo '~~~text'
            for log in /tmp/campaign-100-f2p.log /tmp/chapter-boss-integration.log /tmp/full-run-persistence.log /tmp/visual-release-gate.log /tmp/mobile-ui-regression.log /tmp/gameplay-regression.log /tmp/premium-shop-regression.log; do
              if [ -s "$log" ]; then
                grep -E -i "SCRIPT ERROR:|Parse Error:|Invalid call|Failed to load script|FAIL:|FAILED:|ERROR:" "$log" | tail -n 20 || true
              fi
            done
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Archive QA logs for every beta build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MutantSurvivor-QA-logs-${{ github.run_number }}
          path: |
            /tmp/campaign-100-f2p.log
            /tmp/mission-scene-100.log
            /tmp/prebeta-validation.log
            /tmp/production-art-audit.log
            /tmp/animated-art-runtime.log
            /tmp/chapter-boss-integration.log
            /tmp/full-run-persistence.log
            /tmp/premium-shop-regression.log
            /tmp/gameplay-regression.log
            /tmp/visual-release-gate.log
            /tmp/mobile-ui-regression.log
            /tmp/google-play-preflight.log
            /tmp/mutantsurvivor-startup.log
            /tmp/mutantsurvivor-combat.log
            /tmp/beta-apk-preflight.log
            /tmp/apk-signature.log
            /tmp/apk-badging.log
          if-no-files-found: warn
          retention-days: 21

      # Opt-in rendered screenshots run under a real X11/Mesa renderer.
      # Do not gate beta export on image capture until visual baselines have
      # been reviewed; this diagnostic artifact is for visual inspection.
      - name: Render actual Godot UI screenshots for visual inspection
        if: ${{ github.event_name == 'workflow_dispatch' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            xvfb xauth libxcursor1 libxi6 libxinerama1 libxrandr2 \
            libxrender1 libxfixes3 libxext6 libx11-6 libwayland-cursor0 \
            libgl1 libgl1-mesa-dri libfontconfig1 fonts-dejavu-core
          ldconfig
          ldconfig -p | grep -F 'libXcursor.so.1'
          xvfb-run -a -s '-screen 0 1280x720x24' env LIBGL_ALWAYS_SOFTWARE=1 \
            godot --path . --rendering-driver opengl3 res://tools/visual_qa/capture_runner.tscn -- --scenario=all 2>&1 | tee /tmp/visual-qa-render.log
          grep -Fq 'CAPTURES PASS: 6 real viewport PNGs saved' /tmp/visual-qa-render.log
          test "$(find visual_qa/captures -maxdepth 1 -name '*_actual.png' -type f | wc -l)" -ge 6

      - name: Save rendered Godot UI screenshot artifacts
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: MutantSurvivor-Visual-QA-${{ github.run_number }}
          path: |
            visual_qa/captures/*_actual.png
            /tmp/visual-qa-render.log
          if-no-files-found: warn
          retention-days: 21

      # Publishing is opt-in: builds from ordinary pushes are NOT exposed to testers.
      - name: Publish APK to private itch.io beta (manual opt-in only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_to_itch == true }}
        shell: bash
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${BUTLER_API_KEY}" ]; then
            echo "::error::Set the BUTLER_API_KEY repository secret first."
            exit 1
          fi
          # Official stable channel for CI; butler is not part of the Godot image.
          curl --fail --location --silent --show-error \
            "https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default" \
            --output /tmp/itch-butler.zip
          mkdir -p /tmp/itch-butler
          python3 -m zipfile -e /tmp/itch-butler.zip /tmp/itch-butler
          chmod +x /tmp/itch-butler/butler
          /tmp/itch-butler/butler version
          test -s build/android/MutantSurvivor.apk
          /tmp/itch-butler/butler push build/android \
            banusgames/mutantsurvivor:android-beta \
            --userversion "android-beta-${GITHUB_RUN_NUMBER}"
