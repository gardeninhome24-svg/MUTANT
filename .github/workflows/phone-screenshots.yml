name: MutantSurvivor Phone Resolution Screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "qa/capture_phone_layout.gd"
      - ".github/workflows/phone-screenshots.yml"
      - "scripts/main.gd"
      - "scripts/main_menu.gd"
      - "scripts/user_profile_panel.gd"
      - "scripts/ui/**"
      - "scripts/stage_director.gd"
      - "project.godot"
      - "assets/ui/**"
      - "scenes/main/main.tscn"
      - "scenes/ui/main_menu.tscn"
      # Battle and art changes need actual renders, not only a headless APK.
      - "scripts/mutant_enemy.gd"
      - "scripts/player.gd"
      - "scripts/asset_registry.gd"
      - "scripts/power_effects.gd"
      - "addons/ms_beta/wave_director.gd"
      - "assets/characters/**"
      - "assets/enemies/**"
      - "assets/bosses/**"

permissions:
  contents: read

jobs:
  phone-render:
    name: Render 720x1280 and 420x933 real game screens
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout project and large assets
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install virtual screen and OpenGL rendering libraries
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            xvfb xauth libgl1-mesa-dri libglx-mesa0 libegl1 \
            libxcursor1 libxinerama1 libxi6 libxrandr2 libxrender1 libxfixes3 \
            libfontconfig1 fontconfig libxkbcommon0 libwayland-cursor0 python3
          ldconfig
          test -f /usr/lib/x86_64-linux-gnu/libXcursor.so.1 || ldconfig -p | grep -q libXcursor.so.1
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cp -a /root/.local/share/godot/export_templates/4.7.2.stable/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          mkdir -p /tmp/mutantsurvivor-phone-shots

      - name: Import game assets
        run: godot --headless --path . --editor --import --quit

      - name: Render phone screenshot frames in virtual X11 display
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          XDG_SESSION_TYPE: "x11"
          WAYLAND_DISPLAY: ""
          GDK_BACKEND: "x11"
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 720x1280x24" \
            godot --path . --display-driver x11 --rendering-method gl_compatibility \
            --windowed --resolution 720x1280 \
            --script res://qa/capture_phone_layout.gd -- \
            --out /tmp/mutantsurvivor-phone-shots \
            2>&1 | tee /tmp/mutantsurvivor-visual-render.log
          if grep -E "(SCRIPT ERROR:|Parse Error:|Failed to load script|Failed loading resource|PHONE SHOT ERROR:)" /tmp/mutantsurvivor-visual-render.log; then
            echo "::error::Visual capture reported a runtime or rendering error."
            exit 1
          fi
          test -s /tmp/mutantsurvivor-phone-shots/01_menu_720x1280.png
          test -s /tmp/mutantsurvivor-phone-shots/05_shop_720x1280.png
          test -s /tmp/mutantsurvivor-phone-shots/06_rewards_720x1280.png
          test -s /tmp/mutantsurvivor-phone-shots/07_combat_720x1280.png
          test -s /tmp/mutantsurvivor-phone-shots/08_combat_420x933.png
          test -s /tmp/mutantsurvivor-phone-shots/09_shop_420x933.png
          test -s /tmp/mutantsurvivor-phone-shots/10_equipment_420x933.png
          test -s /tmp/mutantsurvivor-phone-shots/11_character_420x933.png
          test -s /tmp/mutantsurvivor-phone-shots/12_campaign_420x933.png
          test -s /tmp/mutantsurvivor-phone-shots/13_rewards_420x933.png
          test -s /tmp/mutantsurvivor-phone-shots/14_menu_420x933.png
          test -s /tmp/mutantsurvivor-phone-shots/15_backpack_page1_420x933.png
          test -s /tmp/mutantsurvivor-phone-shots/16_backpack_page2_420x933.png
          # Validate the PNG header's real dimensions rather than trusting
          # a file name or successful exit from Godot.
          python3 - <<'PY'
          import glob, struct, hashlib, os
          shots = glob.glob("/tmp/mutantsurvivor-phone-shots/*.png")
          assert len(shots) == 16, f"Expected 16 actual rendered screenshots, got {len(shots)}"
          hashes = set()
          for path in shots:
              assert os.path.getsize(path) > 20000, f"Screenshot unexpectedly small/blank: {path}"
              with open(path, "rb") as file:
                  head = file.read(24)
              assert head[:8] == b"\x89PNG\r\n\x1a\n", f"Not PNG: {path}"
              width, height = struct.unpack(">II", head[16:24])
              expected = (420, 933) if "420x933" in path else (720, 1280)
              assert (width, height) == expected, f"{path}: {(width, height)} != {expected}"
              hashes.add(hashlib.sha256(open(path, "rb").read()).hexdigest())
              print(f"Validated real PNG: {path} {width}x{height}")
          assert len(hashes) >= 13, "Screenshots are unexpectedly identical; scene switching or rendering may be broken"
          PY

      - name: Build a browser-viewable visual review gallery
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html import escape
          gallery = Path("/tmp/mutantsurvivor-phone-shots")
          pictures = sorted(gallery.glob("*.png"))
          cards = []
          for picture in pictures:
              label = escape(picture.stem.replace("_", " "))
              name = escape(picture.name)
              cards.append(f'<article><h2>{label}</h2><a href="{name}"><img src="{name}" loading="lazy" alt="{label}"></a></article>')
          page = """<!DOCTYPE html><html lang="pl"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>MutantSurvivor — Real Godot Visual QA</title>
          <style>body{background:#0c1520;color:#eef7f8;font:16px system-ui;margin:24px}
          h1{color:#c8ee45}p{color:#b0c1cd}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:22px}
          article{background:#16222e;border:1px solid #527279;border-radius:12px;padding:12px}
          h2{font-size:15px;color:#f2c061}img{width:100%;max-width:420px;height:auto;display:block;margin:auto}
          a:focus-visible{outline:3px solid #cbf15a}</style></head><body>
          <h1>MutantSurvivor — rzeczywiste zrzuty Godota</h1>
          <p>Renderowanie Xvfb, nie zrzuty z telefonu. Kliknij obraz, aby zobaczyć pełną rozdzielczość.</p>
          <main>""" + "\n".join(cards) + "</main></body></html>"
          (gallery / "index.html").write_text(page, encoding="utf-8")
          print(f"Gallery generated: {len(pictures)} screenshots")
          PY

      - name: Upload actual rendered screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MutantSurvivor-Phone-Two-Resolutions-Screenshots
          path: /tmp/mutantsurvivor-phone-shots/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload render diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MutantSurvivor-Phone-Render-Logs
          path: /tmp/mutantsurvivor-visual-render.log
          if-no-files-found: warn
          retention-days: 14
