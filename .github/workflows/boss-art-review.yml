name: MutantSurvivor Boss 5-10 Art Candidate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/make_boss_candidate_pack.py
      - .github/workflows/boss-art-review.yml

# Do not run parallel candidate generations against the same branch.
concurrency:
  group: boss-candidates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  boss-art-review:
    name: Generate 66 boss frames and validate candidate pack
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout licensed in-project boss art
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install image processing dependency
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install "Pillow>=10,<13"
          .venv/bin/python -c "from PIL import Image; print('Pillow loaded:', Image.__version__)"

      - name: Generate all 66 chapter 5-10 boss images
        run: |
          set -euo pipefail
          .venv/bin/python tools/make_boss_candidate_pack.py --project . --out build/MutantSurvivor-BossArt-Candidate-05-10.zip
          python3 tools/boss_art_pack.py --zip build/MutantSurvivor-BossArt-Candidate-05-10.zip
          python3 tools/boss_art_geometry.py --zip build/MutantSurvivor-BossArt-Candidate-05-10.zip --report build/boss-geometry.json
          unzip -Z1 build/MutantSurvivor-BossArt-Candidate-05-10.zip | tee build/boss-contents.txt
          test "$(wc -l < build/boss-contents.txt)" -eq 66
          sha256sum build/MutantSurvivor-BossArt-Candidate-05-10.zip | tee build/boss-sha256.txt

      - name: Install validated boss candidate frames into MUTANT main
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          python3 tools/boss_art_pack.py --zip build/MutantSurvivor-BossArt-Candidate-05-10.zip --install
          printf '%s\n'             'ART CANDIDATE ONLY — 66 images generated from existing MUTANT reference silhouettes.'             'Rigid pose transformations and palette variants are NOT artist-approved keyframe animation.'             'Do not remove this marker or publish to Google Play until manually reviewed and replaced if needed.'             > assets/bosses/ART_CANDIDATE.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/bosses/boss_ch0{5,6,7,8,9}/ assets/bosses/boss_ch10/ assets/bosses/ART_CANDIDATE.txt
          if ! git diff --cached --quiet; then
            git commit -m "art: install 66 validated chapter 5-10 candidate boss sprites [skip ci]"
            git push origin HEAD:main
          fi

      - name: Export candidate artwork for human visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BossArt-Ch05-Ch10-REVIEW-\${{ github.run_number }}
          path: |
            build/MutantSurvivor-BossArt-Candidate-05-10.zip
            build/boss-geometry.json
            build/boss-contents.txt
            build/boss-sha256.txt
          if-no-files-found: warn
          retention-days: 30

      # Never automatically publish generated art as final Google Play assets:
      # color shifts/pose reuse are candidates until animation is reviewed.
